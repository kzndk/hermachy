name: test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Compile
        run: python -m compileall -q src tests scripts
      - name: Test
        run: PYTHONPATH=src python -m unittest discover -s tests -v
      - name: Build standalone executables
        run: python scripts/build_zipapps.py
      - name: Smoke-test executables
        run: |
          ./dist/hermachy --version
          ./dist/hermachy-server --version
          ./dist/hermachy-admin --help >/dev/null
          ./dist/hermachy-exec --version
      - name: Verify release checksums and package
        if: matrix.python-version == '3.13'
        run: python scripts/build_release.py --check

  hermes-compatibility:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Prepare pinned Hermes from public source
        run: python compat/hermes/prepare.py "$RUNNER_TEMP/hermes-compatible"
      - name: Install locked runtime and test dependencies
        working-directory: ${{ runner.temp }}/hermes-compatible
        run: |
          python -m pip install 'uv==0.12.13'
          UV_PROJECT_ENVIRONMENT=venv uv sync --locked --python 3.11 --extra dev
      - name: Probe the installed capability
        working-directory: ${{ runner.temp }}/hermes-compatible
        run: |
          HERMES_HOME="$RUNNER_TEMP/hermes-profile" venv/bin/python -c 'from tools.environments.ssh import HERMACHY_CONTROL_VERSION; assert HERMACHY_CONTROL_VERSION == "2"; print("Hermachy safe-executor v2: OK")'
      - name: Run Hermes contract and gateway regression tests
        working-directory: ${{ runner.temp }}/hermes-compatible
        run: |
          ulimit -n 4096
          scripts/run_tests.sh -j 4 \
            tests/hermes_cli/test_hermachy_safe_executor.py \
            tests/tools/test_hermachy_safe_executor_ssh.py \
            tests/tools/test_hermachy_surface_propagation.py \
            tests/tools/test_ssh_environment.py \
            tests/tools/test_ssh_bulk_upload.py \
            tests/tools/test_terminal_scope_multiplex.py \
            tests/gateway/test_hermachy_executor_bridge.py \
            tests/hermes_cli/test_env_loader.py \
            tests/hermes_cli/test_config_env_expansion.py \
            tests/tools/test_terminal_env_bridge.py \
            tests/tools/test_file_tools_container_config.py \
            tests/tools/test_lazy_deps.py \
            tests/tui_gateway/test_protocol.py \
            tests/tui_gateway/test_tui_gateway_server.py \
            tests/agent/test_prompt_builder.py
      - name: Verify installed source has not drifted
        run: python compat/hermes/prepare.py --check "$RUNNER_TEMP/hermes-compatible"
