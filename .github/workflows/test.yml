name: test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Compile
        run: python -m compileall -q src tests scripts
      - name: Test
        run: PYTHONPATH=src python -m unittest discover -s tests -v
      - name: Build standalone executables
        run: python scripts/build_zipapps.py
      - name: Smoke-test executables
        run: |
          ./dist/hermachy --version
          ./dist/hermachy-server --version
          ./dist/hermachy-admin --help >/dev/null
          ./dist/hermachy-exec --version
          test ! -e ./dist/hermachy-gateway
      - name: Verify release checksums and package
        if: matrix.python-version == '3.13'
        run: python scripts/build_release.py --check

  hermes-plugin:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    env:
      HERMES_REVISION: 3b421578588243f920886e6fe79a6faa87ea026e  # v0.23.1; keep in sync with tui/PROVENANCE.json
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Fetch the pinned stock Hermes release
        run: |
          git init -q "$RUNNER_TEMP/hermes"
          git -C "$RUNNER_TEMP/hermes" remote add origin https://github.com/NousResearch/hermes-agent.git
          git -C "$RUNNER_TEMP/hermes" fetch -q --depth=1 origin "$HERMES_REVISION"
          git -C "$RUNNER_TEMP/hermes" checkout -q --detach FETCH_HEAD
      - name: Install Hermes's locked runtime
        working-directory: ${{ runner.temp }}/hermes
        run: |
          HERMES_HOME="$RUNNER_TEMP/hermes-build-profile" \
          HERMES_RUNTIME_DIR="$RUNNER_TEMP/hermes-build-tools" \
            python -m pm.build_env --source . --out venv
      - name: Check the bridge's method list matches the pinned Hermes
        run: |
          python scripts/update_attach_methods.py "$RUNNER_TEMP/hermes"
          git diff --exit-code -- src/hermachy/attach_methods.py
      - name: Test the Hermachy plugin against the real Hermes runtime
        run: |
          PYTHONPATH="$GITHUB_WORKSPACE/src:$RUNNER_TEMP/hermes:$GITHUB_WORKSPACE/tests/integration" \
            "$RUNNER_TEMP/hermes/venv/bin/python" -m unittest test_hermachy_plugin -v
